name = "jht-reclamaciones-api"
main = "jht-reclamaciones-api.js"
compatibility_date = "2026-10-28"

[vars]
ALLOWED_ORIGINS = "https://jhtingeneria.github.io"
TURNSTILE_EXPECTED_HOSTNAME = "jhtingeneria.github.io"
# Correo: ver instrucciones. MAIL_FROM debe ser un remitente permitido por Resend.
MAIL_FROM = "JHT Ingeniería <onboarding@resend.dev>"
MAIL_EMPRESA = "jhtingeneria@gmail.com"
MAIL_CLIENTE_ENABLED = "false"

[[d1_databases]]
binding = "DB"
database_name = "REEMPLAZAR_NOMBRE_DE_TU_BASE"
database_id = "REEMPLAZAR_ID_DE_TU_BASE"

# Secretos (NO van aquí):
#   npx wrangler secret put TURNSTILE_SECRET_KEY
#   npx wrangler secret put RESEND_API_KEY
