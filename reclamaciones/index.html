<!DOCTYPE html>
<!--
  ARCHIVO: reclamaciones/index.html
  Formulario público integrado con Cloudflare Turnstile y la API de JHT.
  Antes de habilitarlo en producción, configurar la Site Key pública real,
  verificar la API desplegada y revisar los requisitos legales aplicables.
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12161a">
  <title>Libro de Reclamaciones — JHT Ingeniería</title>
  <meta name="description" content="Libro de reclamaciones de JHT Ingeniería.">
  <link rel="icon" type="image/png" href="../assets/img/logo-jht-oficial.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/jht-modern.css">
</head>
<body>

  <div data-include="../components/header.html"></div>

  <main>
    <header class="page-header">
      <div class="container">
        <p class="kicker page-header__kicker">Atención al cliente</p>
        <h1>Libro de Reclamaciones</h1>
        <p>Utiliza este formulario para enviar una queja o reclamo a nuestro equipo de atención.</p>
      </div>
    </header>

    <section class="section">
      <div class="container" style="max-width: 820px;">

        <form class="form-grid mt-lg" id="form-reclamacion" method="post" novalidate>
          <!-- Campo señuelo anti-spam; el Worker también debe validar todas las solicitudes. -->
          <div class="form-field" style="position:absolute; left:-9999px;" aria-hidden="true">
            <label for="rec-sitio-web">No completar este campo</label>
            <input type="text" id="rec-sitio-web" name="sitio_web" tabindex="-1" autocomplete="off">
          </div>

          <div class="form-row-2">
            <div class="form-field">
              <label for="rec-tipo">Tipo de documento *</label>
              <select id="rec-tipo" name="tipo_reclamo" required>
                <option value="" disabled selected>Selecciona una opción</option>
                <option>Reclamo</option>
                <option>Queja</option>
              </select>
            </div>
            <div class="form-field">
              <label for="rec-fecha">Fecha</label>
              <input type="date" id="rec-fecha" name="fecha">
            </div>
          </div>

          <h3 class="mt-lg mb-0">Datos del consumidor</h3>
          <div class="form-row-2">
            <div class="form-field">
              <label for="rec-nombre">Nombres y apellidos *</label>
              <input type="text" id="rec-nombre" name="nombre" placeholder="Nombre completo" required>
            </div>
            <div class="form-field">
              <label for="rec-doc">N.º de documento *</label>
              <input type="text" id="rec-doc" name="documento" placeholder="DNI / CE / RUC" required>
            </div>
          </div>
          <div class="form-field">
            <label for="rec-domicilio">Domicilio *</label>
            <input type="text" id="rec-domicilio" name="domicilio" placeholder="Dirección, distrito, ciudad" required maxlength="250">
          </div>
          <div class="form-row-2">
            <div class="form-field">
              <label for="rec-email">Correo electrónico *</label>
              <input type="email" id="rec-email" name="email" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="form-field">
              <label for="rec-telefono">Teléfono</label>
              <input type="tel" id="rec-telefono" name="telefono" placeholder="+51 ___ ___ ___">
            </div>
          </div>

          <h3 class="mt-lg mb-0">Detalle del reclamo</h3>
          <div class="form-field">
            <label for="rec-servicio">Servicio relacionado</label>
            <select id="rec-servicio" name="servicio">
              <option>Estructuras metálicas</option>
              <option>Corte láser</option>
              <option>Soldadura especializada</option>
              <option>Servicios de maquinado y maestranza</option>
              <option>Mantenimiento industrial</option>
              <option>Bombas y válvulas</option>
              <option>Otro</option>
            </select>
          </div>
          <div class="form-field">
            <label for="rec-monto">Monto reclamado (opcional)</label>
            <input type="text" id="rec-monto" name="monto_reclamado" placeholder="Ej.: S/ 1,500.00" maxlength="40">
          </div>
          <div class="form-field">
            <label for="rec-detalle">Descripción del reclamo o queja *</label>
            <textarea id="rec-detalle" name="detalle" rows="5" placeholder="Describe lo sucedido con el mayor detalle posible" required></textarea>
          </div>
          <div class="form-field">
            <label for="rec-pedido">Pedido del consumidor *</label>
            <textarea id="rec-pedido" name="pedido" rows="3" placeholder="¿Qué solución esperas?" required></textarea>
          </div>

          <p style="font-size:.9rem;">Usaremos tus datos únicamente para atender este reclamo. Más información en nuestra <a href="../privacidad/">política de privacidad</a>.</p>

          <!-- Turnstile se mostrará al configurar la Site Key pública. -->
          <div id="jht-turnstile" aria-label="Verificación de seguridad"></div>
          <p id="jht-estado-reclamacion" role="status" aria-live="polite"></p>
          <button type="submit" class="btn btn--primary btn--block" disabled>
            Enviar reclamo
          </button>

          <div id="jht-constancia" role="status" aria-live="polite" hidden
               style="border:1px solid rgba(255,255,255,.3); border-radius:8px; padding:1rem 1.25rem; margin-top:1rem;"></div>
        </form>
      </div>
    </section>
  </main>

  <div data-include="../components/footer.html"></div>
  <div data-include="../components/whatsapp-button.html"></div>

  <script src="../assets/js/includes.js"></script>
  <script src="../assets/js/menu.js"></script>
  <script>
    // Solo esta clave pública debe añadirse aquí. No insertar secretos.
    window.JHT_RECLAMACIONES = {
      api: 'https://jht-reclamaciones-api.jhtingeneria.workers.dev',
      siteKey: '0x4AAAAAAFpTL9JzbP_qFiIQ' // Obtener la Site Key de producción en Cloudflare Turnstile; nunca poner aquí la Secret Key.
    };
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script src="../assets/js/reclamaciones-d1.js" defer></script>
  <script src="../assets/js/animations.js"></script>
  <script src="../assets/js/whatsapp.js"></script>
</body>
</html>
